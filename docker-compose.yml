services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: crime_tracker_db
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: crime_tracker_db
      DB_USER: root
      DB_PASSWORD: rootpass
      DEBUG: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 crime_tracker.asgi:application"

volumes:
  db_data:
  media_data: