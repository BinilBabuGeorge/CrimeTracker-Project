<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <rect width="1600" height="1050" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <style>
      .title { font: bold 32px Arial, sans-serif; fill: #111; }
      .subtitle { font: bold 24px Arial, sans-serif; fill: #111; }
      .label { font: 20px Arial, sans-serif; fill: #111; }
      .small { font: 16px Arial, sans-serif; fill: #111; }
      .box { fill: none; stroke: #111; stroke-width: 2; }
      .proc { fill: none; stroke: #111; stroke-width: 2.2; }
      .line { stroke: #111; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="800" y="70" text-anchor="middle" class="title">CrimeTracker Citizen DFD</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">Level 1 - Citizen / User</text>

  <rect x="90" y="180" width="140" height="60" class="box"/>
  <text x="160" y="218" text-anchor="middle" class="label">Citizen</text>

  <ellipse cx="390" cy="210" rx="110" ry="42" class="proc"/>
  <text x="390" y="217" text-anchor="middle" class="label">Login</text>

  <rect x="320" y="330" width="160" height="55" class="box"/>
  <text x="400" y="364" text-anchor="middle" class="label">User Login DB</text>

  <ellipse cx="720" cy="110" rx="150" ry="42" class="proc"/>
  <text x="720" y="117" text-anchor="middle" class="label">Register</text>

  <ellipse cx="720" cy="230" rx="185" ry="42" class="proc"/>
  <text x="720" y="237" text-anchor="middle" class="label">Submit Complaint</text>

  <ellipse cx="720" cy="350" rx="175" ry="42" class="proc"/>
  <text x="720" y="357" text-anchor="middle" class="label">View Complaint Status</text>

  <ellipse cx="720" cy="470" rx="150" ry="42" class="proc"/>
  <text x="720" y="477" text-anchor="middle" class="label">Send Feedback</text>

  <ellipse cx="720" cy="590" rx="140" ry="42" class="proc"/>
  <text x="720" y="597" text-anchor="middle" class="label">Use Chat</text>

  <ellipse cx="720" cy="710" rx="160" ry="42" class="proc"/>
  <text x="720" y="717" text-anchor="middle" class="label">Send Panic Alert</text>

  <ellipse cx="720" cy="830" rx="150" ry="42" class="proc"/>
  <text x="720" y="837" text-anchor="middle" class="label">View Profile</text>

  <rect x="1140" y="80" width="230" height="55" class="box"/>
  <text x="1255" y="103" text-anchor="middle" class="small">User DB /</text>
  <text x="1255" y="123" text-anchor="middle" class="small">Login DB</text>

  <rect x="1140" y="200" width="230" height="55" class="box"/>
  <text x="1255" y="223" text-anchor="middle" class="small">Crime DB / File Storage /</text>
  <text x="1255" y="243" text-anchor="middle" class="small">Location Data</text>

  <rect x="1140" y="320" width="230" height="55" class="box"/>
  <text x="1255" y="343" text-anchor="middle" class="small">Crime DB / FIR DB /</text>
  <text x="1255" y="363" text-anchor="middle" class="small">Notification DB</text>

  <rect x="1140" y="440" width="230" height="55" class="box"/>
  <text x="1255" y="474" text-anchor="middle" class="label">Feedback DB</text>

  <rect x="1140" y="560" width="230" height="55" class="box"/>
  <text x="1255" y="594" text-anchor="middle" class="label">Chat DB</text>

  <rect x="1140" y="680" width="230" height="55" class="box"/>
  <text x="1255" y="703" text-anchor="middle" class="small">Panic Alert DB /</text>
  <text x="1255" y="723" text-anchor="middle" class="small">Police Station DB</text>

  <rect x="1140" y="800" width="230" height="55" class="box"/>
  <text x="1255" y="834" text-anchor="middle" class="label">User DB</text>

  <line x1="230" y1="210" x2="280" y2="210" class="line"/>
  <line x1="500" y1="210" x2="570" y2="110" class="line"/>
  <line x1="500" y1="210" x2="535" y2="230" class="line"/>
  <line x1="500" y1="210" x2="545" y2="350" class="line"/>
  <line x1="500" y1="210" x2="570" y2="470" class="line"/>
  <line x1="500" y1="210" x2="580" y2="590" class="line"/>
  <line x1="500" y1="210" x2="560" y2="710" class="line"/>
  <line x1="500" y1="210" x2="570" y2="830" class="line"/>
  <line x1="390" y1="252" x2="390" y2="330" class="line"/>

  <line x1="870" y1="110" x2="1140" y2="107" class="line"/>
  <line x1="905" y1="230" x2="1140" y2="227" class="line"/>
  <line x1="895" y1="350" x2="1140" y2="347" class="line"/>
  <line x1="870" y1="470" x2="1140" y2="467" class="line"/>
  <line x1="860" y1="590" x2="1140" y2="587" class="line"/>
  <line x1="880" y1="710" x2="1140" y2="707" class="line"/>
  <line x1="870" y1="830" x2="1140" y2="827" class="line"/>
</svg>
