<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #12324a; }
      .subtitle { font: 600 20px 'Segoe UI', Arial, sans-serif; fill: #2b4c63; }
      .label { font: 600 19px 'Segoe UI', Arial, sans-serif; fill: #17384b; }
      .text { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #28485e; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #456171; }
      .actor { fill: #edf6fb; stroke: #2f6f91; stroke-width: 2.5; rx: 18; ry: 18; }
      .layer { fill: #ffffff; stroke: #295a74; stroke-width: 3; rx: 24; ry: 24; }
      .module { fill: #f6fbfe; stroke: #5b8da8; stroke-width: 2; rx: 18; ry: 18; }
      .service { fill: #fff9ef; stroke: #d38b29; stroke-width: 2; rx: 18; ry: 18; }
      .store { fill: #f3f8f0; stroke: #6b8e59; stroke-width: 2.5; rx: 18; ry: 18; }
      .arrow { stroke: #486878; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 10 8; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#486878"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="100%" stop-color="#eef5f8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="800" y="60" text-anchor="middle" class="title">CrimeTracker System Architecture</text>
  <text x="800" y="95" text-anchor="middle" class="subtitle">Django-based Complaint Management, Police Coordination, Chat, and Panic Alert Platform</text>

  <rect x="60" y="150" width="1480" height="170" class="layer"/>
  <text x="800" y="185" text-anchor="middle" class="label">External Actors / Access Layer</text>

  <rect x="110" y="215" width="360" height="75" class="actor"/>
  <text x="290" y="248" text-anchor="middle" class="label">Citizen</text>
  <text x="290" y="273" text-anchor="middle" class="small">Register, submit complaints, view status, chat, send panic alert</text>

  <rect x="620" y="215" width="360" height="75" class="actor"/>
  <text x="800" y="248" text-anchor="middle" class="label">Administrator</text>
  <text x="800" y="273" text-anchor="middle" class="small">Approve stations, assign complaints, manage categories, analytics</text>

  <rect x="1130" y="215" width="360" height="75" class="actor"/>
  <text x="1310" y="248" text-anchor="middle" class="label">Police Station</text>
  <text x="1310" y="273" text-anchor="middle" class="small">Manage officers, process complaints, FIR, alerts, citizen chat</text>

  <rect x="60" y="360" width="1480" height="290" class="layer"/>
  <text x="800" y="395" text-anchor="middle" class="label">Web Application Layer</text>

  <rect x="100" y="430" width="300" height="170" class="module"/>
  <text x="250" y="462" text-anchor="middle" class="label">Presentation Layer</text>
  <text x="250" y="494" text-anchor="middle" class="text">Django Templates</text>
  <text x="250" y="522" text-anchor="middle" class="text">HTML, CSS, JavaScript</text>
  <text x="250" y="550" text-anchor="middle" class="text">Leaflet Complaint Map</text>
  <text x="250" y="578" text-anchor="middle" class="text">Role-based Dashboards</text>

  <rect x="450" y="430" width="340" height="170" class="module"/>
  <text x="620" y="462" text-anchor="middle" class="label">Application Logic</text>
  <text x="620" y="494" text-anchor="middle" class="text">Django Views and URL Routing</text>
  <text x="620" y="522" text-anchor="middle" class="text">Authentication and Session Handling</text>
  <text x="620" y="550" text-anchor="middle" class="text">Complaint and FIR Workflow</text>
  <text x="620" y="578" text-anchor="middle" class="text">Feedback and Panic Alert Processing</text>

  <rect x="840" y="430" width="300" height="170" class="module"/>
  <text x="990" y="462" text-anchor="middle" class="label">Core Functional Modules</text>
  <text x="990" y="494" text-anchor="middle" class="text">Citizen Module</text>
  <text x="990" y="522" text-anchor="middle" class="text">Administrator Module</text>
  <text x="990" y="550" text-anchor="middle" class="text">Police Station Module</text>
  <text x="990" y="578" text-anchor="middle" class="text">Complaint Tracking and Assignment</text>

  <rect x="1190" y="430" width="300" height="170" class="service"/>
  <text x="1340" y="462" text-anchor="middle" class="label">Real-Time Services</text>
  <text x="1340" y="494" text-anchor="middle" class="text">Django Channels</text>
  <text x="1340" y="522" text-anchor="middle" class="text">WebSocket Chat</text>
  <text x="1340" y="550" text-anchor="middle" class="text">Panic Alert Broadcasting</text>
  <text x="1340" y="578" text-anchor="middle" class="text">Unread Message Updates</text>

  <rect x="60" y="700" width="1480" height="210" class="layer"/>
  <text x="800" y="735" text-anchor="middle" class="label">Data and Storage Layer</text>

  <rect x="120" y="780" width="400" height="95" class="store"/>
  <text x="320" y="813" text-anchor="middle" class="label">MySQL Database</text>
  <text x="320" y="840" text-anchor="middle" class="text">Login, Users, Districts, Categories, Police Stations</text>
  <text x="320" y="865" text-anchor="middle" class="text">Complaints, FIR, Feedback, Panic Alerts, Chat Records</text>

  <rect x="600" y="780" width="400" height="95" class="store"/>
  <text x="800" y="813" text-anchor="middle" class="label">Media Storage</text>
  <text x="800" y="840" text-anchor="middle" class="text">Supporting Documents, Images, PDFs, Video Evidence</text>
  <text x="800" y="865" text-anchor="middle" class="text">Complaint Attachments Stored in Django Media Directory</text>

  <rect x="1080" y="780" width="400" height="95" class="store"/>
  <text x="1280" y="813" text-anchor="middle" class="label">In-Memory Channel Layer</text>
  <text x="1280" y="840" text-anchor="middle" class="text">Active Chat Rooms, WebSocket Groups</text>
  <text x="1280" y="865" text-anchor="middle" class="text">Panic Admin and Station Notification Streams</text>

  <path d="M290 290 L290 430" class="arrow"/>
  <path d="M800 290 L800 430" class="arrow"/>
  <path d="M1310 290 L1310 430" class="arrow"/>

  <path d="M400 515 L450 515" class="arrow"/>
  <path d="M790 515 L840 515" class="arrow"/>
  <path d="M1140 515 L1190 515" class="arrow"/>

  <path d="M620 600 L620 780" class="arrow"/>
  <path d="M800 600 L800 780" class="arrow"/>
  <path d="M1340 600 L1280 780" class="arrow"/>

  <path d="M520 828 L600 828" class="arrow dashed"/>
  <path d="M1000 828 L1080 828" class="arrow dashed"/>

  <text x="60" y="945" class="small">Architecture based on the implemented Django project: complaint submission, map-based location capture, FIR workflow, real-time chat, and panic alert forwarding.</text>
</svg>
