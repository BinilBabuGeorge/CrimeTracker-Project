{% extends "Station/header.html" %}
{% block content %}
<div class="pagetitle">
  <h1>Add Police Officer</h1>
</div>

<section class="section" style="min-height: 500px;">
  <div class="row">
    <div class="col-lg-12">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-warning">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Create Officer Account</h5>
          <form method="post" action="{% url 'station_save_officer' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label>Name</label>
                  <input class="form-control" name="name" required>
                </div>
                <div class="form-group mb-3">
                  <label>Username</label>
                  <input class="form-control" name="username" required>
                </div>
                <div class="form-group mb-3">
                  <label>Password</label>
                  <input type="password" class="form-control" name="password" required>
                </div>
                <div class="form-group mb-3">
                  <label>Designation</label>
                  <select class="form-control" name="p_type" required>
                    <option value="">--Select--</option>
                    <option value="DSP">DSP</option>
                    <option value="CI">CI</option>
                    <option value="SI">SI</option>
                    <option value="ASI">ASI</option>
                    <option value="HC">HC</option>
                    <option value="PC">PC</option>
                  </select>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label>Phone</label>
                  <input class="form-control" name="phone" required>
                </div>
                <div class="form-group mb-3">
                  <label>Email</label>
                  <input type="email" class="form-control" name="mail_id" required>
                </div>
                <div class="form-group mb-3">
                  <label>Gender</label>
                  <select class="form-control" name="gender">
                    <option value="">--Select--</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <div class="form-group mb-3">
                  <label>Date of birth</label>
                  <input type="date" class="form-control" name="date_of_birth">
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label>Qualification</label>
                  <input class="form-control" name="qualification">
                </div>
                <div class="form-group mb-3">
                  <label>Address</label>
                  <textarea class="form-control" name="address"></textarea>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label>Photo (optional)</label>
                  <input type="file" class="form-control" name="photo">
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label>Proof (optional)</label>
                  <input type="file" class="form-control" name="proof">
                </div>
              </div>
            </div>
            <div class="text-center">
              <button class="btn btn-primary" type="submit">Create</button>
              <a class="btn btn-secondary" href="{% url 'station_officers' %}">Back</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
