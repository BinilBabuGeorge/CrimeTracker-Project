{% extends "Station/header.html" %}
{% block content %}
<div class="pagetitle">
  <h1>Edit Police Officer</h1>
</div>

<section class="section" style="min-height: 500px;">
  <div class="row">
    <div class="col-lg-12">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ officer.name }}</h5>
          <form method="post" action="{% url 'station_update_officer' officer.police_officer_id %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label>Name</label>
                  <input class="form-control" name="name" value="{{ officer.name }}" required>
                </div>
                <div class="form-group mb-3">
                  <label>Designation</label>
                  <input class="form-control" name="p_type" value="{{ officer.p_type }}">
                </div>
                <div class="form-group mb-3">
                  <label>Qualification</label>
                  <input class="form-control" name="qualification" value="{{ officer.qualification }}">
                </div>
                <div class="form-group mb-3">
                  <label>Gender</label>
                  <input class="form-control" name="gender" value="{{ officer.gender }}">
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label>Phone</label>
                  <input class="form-control" name="phone" value="{{ officer.phone_number }}">
                </div>
                <div class="form-group mb-3">
                  <label>Email</label>
                  <input type="email" class="form-control" name="mail_id" value="{{ officer.mail_id }}">
                </div>
                <div class="form-group mb-3">
                  <label>Date of birth</label>
                  <input type="date" class="form-control" name="date_of_birth" value="{{ officer.date_of_birth|date:'Y-m-d' }}">
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label>Address</label>
                  <textarea class="form-control" name="address">{{ officer.address }}</textarea>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label>Photo (optional)</label>
                  <input type="file" class="form-control" name="photo">
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label>Proof (optional)</label>
                  <input type="file" class="form-control" name="proof">
                </div>
              </div>
            </div>
            <div class="text-center">
              <button class="btn btn-primary" type="submit">Save</button>
              <a class="btn btn-secondary" href="{% url 'station_officers' %}">Back</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
