{% extends "Station/header.html" %}
{% block content %}
<div class="pagetitle">
  <h1>Create FIR</h1>
</div>

<section class="section" style="min-height: 500px;">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">FIR for: {{ crime.subject }}</h5>
          <form method="post" action="{% url 'station_save_fir' crime.crime_id %}">
            {% csrf_token %}
            <div class="form-group mb-3">
              <label>Description</label>
              <textarea class="form-control" name="description" rows="4" required></textarea>
            </div>
            <div class="form-group mb-3">
              <label>Witness Details</label>
              <textarea class="form-control" name="witness_details" rows="3" required></textarea>
            </div>
            <div class="form-group mb-3">
              <label>Evidence Details</label>
              <textarea class="form-control" name="evidence_details" rows="3" required></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Create FIR</button>
            <a class="btn btn-secondary" href="{% url 'station_complaint_detail' crime.crime_id %}">Back</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
